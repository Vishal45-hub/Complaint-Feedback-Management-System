<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaint / Feedback Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-comments"></i> Complaint / Feedback Management System</h1>
            <p class="subtitle">College Complaint Portal</p>
        </header>

        <main>
            <!-- Submit Complaint Section -->
            <section class="card submit-section">
                <h2><i class="fas fa-plus-circle"></i> Submit New Complaint</h2>
                <form id="complaintForm">
                    <div class="form-group">
                        <label for="name">Your Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject:</label>
                        <input type="text" id="subject" name="subject" required placeholder="Brief description of your complaint">
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message:</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Please describe your complaint or feedback in detail"></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-paper-plane"></i> Submit Complaint
                    </button>
                </form>
            </section>

            <!-- Status Messages -->
            <div id="statusMessage" class="status-message"></div>

            <!-- Complaints List Section -->
            <section class="card complaints-section">
                <h2><i class="fas fa-list"></i> All Complaints</h2>
                <div class="complaints-controls">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="Search complaints...">
                        <button id="clearSearch" class="btn btn-secondary">Clear</button>
                    </div>
                    <div class="filter-box">
                        <label for="statusFilter">Filter by Status:</label>
                        <select id="statusFilter">
                            <option value="all">All</option>
                            <option value="Pending">Pending</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                    </div>
                </div>
                
                <div id="complaintsList" class="complaints-list">
                    <!-- Complaints will be loaded here -->
                </div>
                
                <div id="loading" class="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading complaints...
                </div>
                
                <div id="noComplaints" class="no-complaints" style="display: none;">
                    <i class="fas fa-inbox"></i>
                    <p>No complaints found.</p>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2024 Complaint Management System. All rights reserved.</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
